    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />

    <!-- SEO -->
    <title>Pioneers Health Research | تدريب وإشراف على البحث العلمي والنشر</title>

    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Pioneers Health Research" />
    <link rel="canonical" href="https://pioneersresearch.com/" />

    <meta

      content="تدريب وإشراف أكاديمي على البحث العلمي من صياغة السؤال البحثي حتى النشر."
    />
    <meta name="twitter:image" content="https://pioneersresearch.com/og-image.png" />

    <!-- Structured data: helps Google show a rich, branded result -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Pioneers Health Research",
        "alternateName": "بيونيرز للأبحاث الصحية",
        "url": "https://pioneersresearch.com/",
        "logo": "https://pioneersresearch.com/pwa-512.png",

        "description": "تدريب وإشراف أكاديمي على البحث العلمي من صياغة السؤال البحثي حتى النشر، مع دورات معتمدة وخدمات بحثية وشهادات موثّقة.",
        "email": "pioneersforresearchllc@gmail.com",
        "sameAs": []
      }
    </script>

    <!-- Branded first-paint splash: the logo fills with liquid until the app
         mounts (React replaces #root's contents, removing it). -->
    <style>
      #app-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; z-index: 9999; }
      #app-splash .asp-box { position: relative; width: 96px; height: 96px; }
      #app-splash .asp-ghost { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: .12; filter: grayscale(1); }
      #app-splash .asp-jar { position: absolute; inset: 0; overflow: hidden; -webkit-mask: url(/logo.png) center/contain no-repeat; mask: url(/logo.png) center/contain no-repeat; }
      #app-splash .asp-water { position: absolute; left: 0; right: 0; bottom: 0; height: 8%; background: linear-gradient(180deg, #e6c476, #c9a24b 48%, #17406f); animation: asp-fill 2.9s cubic-bezier(.45,0,.25,1) infinite alternate; }
      #app-splash .asp-water::before, #app-splash .asp-water::after { content: ""; position: absolute; left: 50%; top: 0; width: 200%; height: 200%; transform: translate(-50%, -75%); }
      #app-splash .asp-water::before { background: #c9a24b; border-radius: 41%; animation: asp-swirl 6s linear infinite; }
      #app-splash .asp-water::after { background: rgba(230,196,118,.55); border-radius: 46%; animation: asp-swirl 10s linear infinite reverse; }
      @keyframes asp-fill { 0% { height: 8%; } 100% { height: 100%; } }
      @keyframes asp-swirl { to { transform: translate(-50%, -75%) rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #app-splash .asp-water, #app-splash .asp-water::before, #app-splash .asp-water::after { animation: none; } #app-splash .asp-water { height: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <div class="asp-box">
          <img class="asp-ghost" src="/logo.png" alt="" />
          <div class="asp-jar"><div class="asp-water"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
