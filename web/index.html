    <!-- Branded first-paint splash: the logo fills with liquid until the app
         mounts (React replaces #root's contents, removing it). -->
    <style>
      #app-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; z-index: 9999; }
      #app-splash .asp-box { position: relative; width: 104px; height: 104px; animation: asp-pulse 2s ease-in-out infinite; }
      #app-splash .asp-logo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      #app-splash .asp-jar { position: absolute; inset: 0; overflow: hidden; opacity: .55; -webkit-mask: url(/logo.png) center/contain no-repeat; mask: url(/logo.png) center/contain no-repeat; }
      #app-splash .asp-water { position: absolute; left: 0; right: 0; bottom: 0; height: 8%; background: linear-gradient(180deg, #e6c476, #c9a24b 48%, #17406f); animation: asp-fill 2.9s cubic-bezier(.45,0,.25,1) infinite alternate; }
      #app-splash .asp-water::before, #app-splash .asp-water::after { content: ""; position: absolute; left: 50%; top: 0; width: 200%; height: 200%; transform: translate(-50%, -75%); }
      #app-splash .asp-water::before { background: #c9a24b; border-radius: 41%; animation: asp-swirl 6s linear infinite; }
      #app-splash .asp-water::after { background: rgba(230,196,118,.55); border-radius: 46%; animation: asp-swirl 10s linear infinite reverse; }
      @keyframes asp-fill { 0% { height: 8%; } 100% { height: 100%; } }
      @keyframes asp-swirl { to { transform: translate(-50%, -75%) rotate(360deg); } }
      @keyframes asp-pulse { 0%, 100% { opacity: .92; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #app-splash .asp-water, #app-splash .asp-water::before, #app-splash .asp-water::after, #app-splash .asp-box { animation: none; } #app-splash .asp-water { height: 100%; } }

    <script>
      // Failsafe: the app normally replaces #root (removing the splash) the
      // moment it mounts. This inline script runs even if the module bundle
      // fails to load, so a visitor is never left stuck on the splash.
      setTimeout(function () {
        var s = document.getElementById('app-splash')
        if (s) { s.style.transition = 'opacity .3s'; s.style.opacity = '0'; setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s) }, 350) }
      }, 6000)
